name: CI & Release Pipeline

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  # ==========================================
  # STAGE 1: Testes & Análise
  # ==========================================
  ci:
    name: Tests & Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'oracle'
          cache: 'maven'

      - name: Run unit tests
        run: mvn test -B --file pom.xml

      - name: Generate JaCoCo XML report
        run: mvn jacoco:report -B

      - name: Debug - list jacoco output
        run: find target/site/jacoco -type f || echo "pasta target/site/jacoco não existe"

      - name: Run mutation testing (Pitest)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: >
          mvn test-compile org.pitest:pitest-maven:mutationCoverage -B -Dverbose
          -DoutputFormats=HTML,XML,stryker-dashboard
          -Ddashboard.reportType=full
          -Ddashboard.project=github.com/flaviohnm/dynamodb
          -Ddashboard.version=${{ github.head_ref || github.ref_name }}
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/site/jacoco/
            target/pit-reports/
            target/surefire-reports/
          retention-days: 14

      - name: Qodana scan
        uses: JetBrains/qodana-action@v2026.2.0
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: true
          push-fixes: 'none'
        continue-on-error: true

  # ==========================================
  # STAGE 2: Criar Pull Requests (depende de CI)
  # ==========================================
  auto-pr:
    name: Create Pull Requests
    needs: ci  # ← ESPERA CI TERMINAR COM SUCESSO
    if: github.event_name == 'push'  # Só em push, não em PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.6

      - name: Create PR (feature/* → develop | develop → main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"
          
          # Determina branch alvo baseado na branch atual
          if [[ $CURRENT_BRANCH == feature/* ]]; then
            TARGET_BRANCH="develop"
            PR_TITLE="${CURRENT_BRANCH}"
            PR_BODY="PR automático gerado a partir da branch \`${CURRENT_BRANCH}\`. Testes passaram! ✅"
          elif [[ $CURRENT_BRANCH == "develop" ]]; then
            TARGET_BRANCH="main"
            PR_TITLE="release: develop → main"
            PR_BODY="PR automático de release. Testes passaram! ✅ Ao ser finalizado, uma tag será criada automaticamente com base nos Conventional Commits incluídos."
          else
            echo "⚠️ Branch $CURRENT_BRANCH não está configurada para auto-PR."
            exit 0
          fi
          
          # Verifica se PR já existe
          EXISTING=$(gh pr list --base "$TARGET_BRANCH" --head "$CURRENT_BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          
          if [ -z "$EXISTING" ]; then
            echo "✅ Criando PR: $CURRENT_BRANCH → $TARGET_BRANCH"
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$CURRENT_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          else
            echo "ℹ️  PR já existe (#$EXISTING): $CURRENT_BRANCH → $TARGET_BRANCH"
          fi

  # ==========================================
  # STAGE 3: Release & Tag (depende de Auto-PR, só em main)
  # ==========================================
  release:
    name: Release & Tag
    needs: auto-pr  # ← ESPERA AUTO-PR TERMINAR COM SUCESSO
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}  # ← PAT com bypass de proteção

      - name: Fetch all tags
        run: git fetch --tags

      - name: Check if release already exists
        id: tag_check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          
          CURRENT_COMMIT=$(git rev-parse HEAD)
          TAGGED_COMMIT=$(git rev-list -n 1 "$LAST_TAG" 2>/dev/null || echo "")
          
          if [ "$CURRENT_COMMIT" = "$TAGGED_COMMIT" ]; then
            echo "⚠️  Commit atual já possui tag ($LAST_TAG). Release já foi criada."
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Prosseguindo com a release..."
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi
          
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

      - name: Set up Node.js (para standard-version)
        if: steps.tag_check.outputs.tag_exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install standard-version
        if: steps.tag_check.outputs.tag_exists == 'false'
        run: npm install -g standard-version

      - name: Configure Git user
        if: steps.tag_check.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Usa o PAT no remote para o push ter permissão de bypass
          git remote set-url origin https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Sync with latest main
        if: steps.tag_check.outputs.tag_exists == 'false'
        run: |
          # Garante que estamos em cima do commit mais recente da main antes
          # de gerar o commit de versionamento (evita non-fast-forward no push)
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Detect version bump and generate CHANGELOG
        if: steps.tag_check.outputs.tag_exists == 'false'
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          
          # ✅ Standard-version faz TUDO: incrementa versão, gera CHANGELOG, cria tag
          # Baseado em Conventional Commits (feat: MINOR, fix: PATCH, BREAKING: MAJOR)
          standard-version

      - name: Get new version
        if: steps.tag_check.outputs.tag_exists == 'false'
        id: new_version
        run: |
          # Standard-version já criou a tag, basta pegar ela
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$NEW_TAG" ]; then
            echo "❌ Standard-version falhou ao criar a tag"
            echo "⚠️  Revise os logs acima para descobrir o motivo"
            exit 1
          fi
          
          NEW_VERSION=${NEW_TAG#v}  # Remove o "v" do início
          echo "✅ Tag criada com sucesso: $NEW_TAG"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Push changes and tags
        if: steps.tag_check.outputs.tag_exists == 'false'
        run: |
          # Tenta o push; se algo avançou remotamente entre o sync e agora,
          # faz rebase e tenta de novo (proteção extra contra corrida)
          for i in 1 2 3; do
            if git push origin main; then
              break
            fi
            echo "⚠️  Push rejeitado, sincronizando e tentando de novo ($i/3)..."
            git fetch origin main
            git rebase origin/main
          done
          
          # Proteção extra: se a tag desta execução já existir no remoto
          # (resquício de execução anterior), remove antes de enviar
          NEW_TAG=$(git describe --tags --abbrev=0)
          if git ls-remote --tags origin | grep -q "refs/tags/$NEW_TAG$"; then
            echo "⚠️  Tag $NEW_TAG já existe no remoto. Removendo antes de reenviar..."
            git push origin --delete "$NEW_TAG" 2>/dev/null || true
          fi
          
          git push origin --tags

      - name: Generate Release Notes
        if: steps.tag_check.outputs.tag_exists == 'false'
        id: release_notes
        run: |
          NEW_TAG=${{ steps.new_version.outputs.tag }}
          LAST_TAG=${{ steps.version.outputs.last_tag }}
          
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk '/^## \[/ { if (found) exit; found=1; next } found { print }' CHANGELOG.md)
          else
            NOTES=$(git log $LAST_TAG..$NEW_TAG --oneline --pretty=format:"- %h: %s")
          fi
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.tag_check.outputs.tag_exists == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.new_version.outputs.tag }}
          name: "Release ${{ steps.new_version.outputs.version }}"
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false