name: Mutation testing

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  mutationtesting:
    if: contains(github.event.head_commit.message, 'maven-release-plugin') != true
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.6
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4.2.1
        with:
          java-version: 22
          distribution: 'oracle'
          cache: maven

      - name: Install reporter
        run: mvn -B --no-transfer-progress install

      # PRs (e qualquer evento fora de push na main): roda o Pitest normalmente,
      # mas sem tentar subir para o Stryker Dashboard (evita falha por falta de secret).
      - name: Run Pitest (sem upload para o dashboard)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: mvn -B -e --no-transfer-progress test-compile org.pitest:pitest-maven:mutationCoverage -Dverbose -DoutputFormats=HTML,XML

      # Push na main: roda o Pitest e sobe o relatório para o Stryker Dashboard.
      - name: Run Pitest and upload report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mvn -B -e --no-transfer-progress test-compile org.pitest:pitest-maven:mutationCoverage -Dverbose
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

      # Opcional: deixa o relatório HTML do Pitest disponível como artifact do run,
      # útil para inspecionar mutantes sobreviventes direto no PR.
      - name: Upload Pitest HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-report
          path: target/pit-reports/
          retention-days: 14