name: Auto PR - develop -> main

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.6

      - name: Create PR to main (se ainda não existir)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')

          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base main \
              --head develop \
              --title "release: develop -> main" \
              --body "PR automático de release. Ao ser finalizado, uma tag será criada automaticamente com base nos Conventional Commits incluídos."
          else
            echo "Já existe PR aberto (#$EXISTING) de develop para main. Nada a fazer."
          fi
