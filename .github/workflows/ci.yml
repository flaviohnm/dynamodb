name: CI - Tests & Analysis

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['22']
        architecture: ['x64']

    name: CI with JDK ${{ matrix.java }} on ${{ matrix.architecture }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'oracle'
          architecture: ${{ matrix.architecture }}
          cache: 'maven'

      - name: Run unit tests
        run: mvn test -B --file pom.xml

      - name: Run mutation testing (Pitest)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: mvn test-compile org.pitest:pitest-maven:mutationCoverage -B -Dverbose -DoutputFormats=HTML,XML
        continue-on-error: true

      - name: Generate JaCoCo badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true
          jacoco-csv-file: "target/site/jacoco/jacoco.csv"
        continue-on-error: true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/site/jacoco/
            target/pit-reports/
            target/surefire-reports/
          retention-days: 14

      - name: Qodana scan
        uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false
          push-fixes: 'none'
        continue-on-error: true

      - name: Log JaCoCo coverage
        if: steps.jacoco.outcome == 'success'
        run: |
          echo "Coverage: ${{ steps.jacoco.outputs.coverage }}%"
          echo "Branches: ${{ steps.jacoco.outputs.branches }}%"
