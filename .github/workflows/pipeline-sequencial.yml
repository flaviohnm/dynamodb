name: CI & Release Pipeline

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  # ==========================================
  # STAGE 1: Testes & Análise
  # ==========================================
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['22']
        architecture: ['x64']

    name: Tests & Analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'oracle'
          architecture: ${{ matrix.architecture }}
          cache: 'maven'

      - name: Run unit tests
        run: mvn test -B --file pom.xml

      - name: Run mutation testing (Pitest)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: mvn test-compile org.pitest:pitest-maven:mutationCoverage -B -Dverbose -DoutputFormats=HTML,XML
        continue-on-error: true

      - name: Generate JaCoCo badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true
          jacoco-csv-file: "target/site/jacoco/jacoco.csv"
        continue-on-error: true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/site/jacoco/
            target/pit-reports/
            target/surefire-reports/
          retention-days: 14

      - name: Qodana scan
        uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false
          push-fixes: 'none'
        continue-on-error: true

      - name: Log JaCoCo coverage
        if: steps.jacoco.outcome == 'success'
        run: |
          echo "Coverage: ${{ steps.jacoco.outputs.coverage }}%"
          echo "Branches: ${{ steps.jacoco.outputs.branches }}%"

  # ==========================================
  # STAGE 2: Auto-PR (depende de CI)
  # ==========================================
  auto-pr:
    needs: ci  # ← ESPERA CI TERMINAR COM SUCESSO
    if: github.event_name == 'push'  # Só em push, não em PR
    runs-on: ubuntu-latest

    name: Create Pull Requests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.6

      - name: Create PR (feature/* → develop | develop → main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"
          
          # Determina branch alvo baseado na branch atual
          if [[ $CURRENT_BRANCH == feature/* ]]; then
            TARGET_BRANCH="develop"
            PR_TITLE="${CURRENT_BRANCH}"
            PR_BODY="PR automático gerado a partir da branch \`${CURRENT_BRANCH}\`. Testes passaram! ✅"
          elif [[ $CURRENT_BRANCH == "develop" ]]; then
            TARGET_BRANCH="main"
            PR_TITLE="release: develop → main"
            PR_BODY="PR automático de release. Testes passaram! ✅ Ao ser finalizado, uma tag será criada automaticamente com base nos Conventional Commits incluídos."
          else
            echo "⚠️ Branch $CURRENT_BRANCH não está configurada para auto-PR."
            exit 0
          fi
          
          # Verifica se PR já existe
          EXISTING=$(gh pr list --base "$TARGET_BRANCH" --head "$CURRENT_BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          
          if [ -z "$EXISTING" ]; then
            echo "✅ Criando PR: $CURRENT_BRANCH → $TARGET_BRANCH"
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$CURRENT_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          else
            echo "ℹ️  PR já existe (#$EXISTING): $CURRENT_BRANCH → $TARGET_BRANCH"
          fi

  # ==========================================
  # STAGE 3: Release (depende de Auto-PR, só em main)
  # ==========================================
  release:
    needs: auto-pr  # ← ESPERA AUTO-PR TERMINAR COM SUCESSO
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    name: Release & Tag

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.6
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Check if release already exists
        id: tag_check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          
          CURRENT_COMMIT=$(git rev-parse HEAD)
          TAGGED_COMMIT=$(git rev-list -n 1 "$LAST_TAG" 2>/dev/null || echo "")
          
          if [ "$CURRENT_COMMIT" = "$TAGGED_COMMIT" ]; then
            echo "⚠️  Commit atual já possui tag ($LAST_TAG). Release já foi criada."
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Prosseguindo com a release..."
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi
          
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

      - name: Set up Node.js (para standard-version)
        if: steps.tag_check.outputs.tag_exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install standard-version
        if: steps.tag_check.outputs.tag_exists == 'false'
        run: npm install -g standard-version

      - name: Configure Git user
        if: steps.tag_check.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clean up duplicate tags (local)
        if: steps.tag_check.outputs.tag_exists == 'false'
        run: |
          LAST_TAG="${{ steps.tag_check.outputs.last_tag }}"
          if [ ! -z "$LAST_TAG" ]; then
            git tag -d "$LAST_TAG" 2>/dev/null || true
            echo "✅ Tag local $LAST_TAG removida (será recriada)"
          fi

      - name: Detect version bump and generate CHANGELOG
        if: steps.tag_check.outputs.tag_exists == 'false'
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          
          RELEASE_TYPE=$(standard-version --dry-run 2>&1 | grep -oP "bumping version in .* from \K[^ ]+" || echo "patch")
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT
          
          standard-version --no-verify
        continue-on-error: true

      - name: Get new version
        if: steps.tag_check.outputs.tag_exists == 'false'
        id: new_version
        run: |
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$NEW_TAG" ]; then
            echo "❌ Tag não foi criada pelo standard-version"
          
            if [ -f "pom.xml" ]; then
              NEW_VERSION=$(grep -oP '<version>\K[^<]+' pom.xml | head -1)
              NEW_TAG="v${NEW_VERSION}"
              echo "✅ Usando versão do pom.xml: $NEW_TAG"
              git tag "$NEW_TAG"
            else
              echo "❌ Não conseguiu detectar versão"
              exit 1
            fi
          fi
          
          NEW_VERSION=${NEW_TAG#v}
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Push changes and tags
        if: steps.tag_check.outputs.tag_exists == 'false'
        run: |
          git push origin --tags

      - name: Generate Release Notes
        if: steps.tag_check.outputs.tag_exists == 'false'
        id: release_notes
        run: |
          NEW_TAG=${{ steps.new_version.outputs.tag }}
          LAST_TAG=${{ steps.version.outputs.last_tag }}
          
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk '/^## \[/ { if (found) exit; found=1; next } found { print }' CHANGELOG.md)
          else
            NOTES=$(git log $LAST_TAG..$NEW_TAG --oneline --pretty=format:"- %h: %s")
          fi
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.tag_check.outputs.tag_exists == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.new_version.outputs.tag }}
          name: "Release ${{ steps.new_version.outputs.version }}"
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false