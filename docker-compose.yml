services:
  customer:
    container_name: floci
    image: floci/floci:latest-aws # Substitua pela tag exata da imagem do Floci que você utiliza
    ports:
      - "4566:4566" # Porta do Gateway do Floci
    environment:
      - FLOCI_DEFAULT_REGION=sa-east-1
      - FLOCI_DEFAULT_ACCOUNT=000000000000
      - FLOCI_AUTH_VALIDATE_SIGNATURES=false
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - LIFECYCLE_HOOK_TIMEOUT=120
    volumes:
      # Volume para persistência de dados do Floci
       - /var/run/docker.sock:/var/run/docker.sock
       - ./data:/app/data
       - ./files/database:/etc/files/database
       - ./init/start.d:/etc/floci/init/start.d:ro
    networks:
      - network
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 4566 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://floci:4566
      - AWS_DEFAULT_REGION=sa-east-1
      - AWS_REGION=sa-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    networks:
      - network


networks:
  network:
    driver: bridge
